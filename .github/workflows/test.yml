name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: beta
      - name: Install app dependencies
        run: flutter pub get
        working-directory: app
      - name: Test app
        run: flutter test
        working-directory: app
      - name: Install game_engine dependencies
        run: dart pub get
        working-directory: packages/game_engine
      - name: Test game_engine
        run: dart test
        working-directory: packages/game_engine
